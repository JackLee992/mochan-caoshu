<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <title>墨禪 · 草書經卷</title>
  <meta name="description" content="靜觀名家草書，臨賞心經、金剛經、道德經、論語與永嘉證道歌。墨禪，為草書愛好者而設的經典閱讀與字帖欣賞空間。">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳至經卷</a>
  <header class="site-header">
    <a class="brand" href="#" aria-label="墨禪首頁"><span class="seal">墨</span><span class="brand-name">墨禪<span class="brand-sub">草書經卷</span></span></a>
    <nav class="main-nav" aria-label="主選單">
      <button class="nav-item active" data-view="reader" aria-current="page">經卷臨賞</button>
      <button class="nav-item" data-view="gallery">名家字帖</button>
      <button class="nav-item" data-view="fonts">書體雅集</button>
    </nav>
    <span class="header-note">一筆一念 · 澄心觀照</span>
  </header>
  <main id="main">
    <section id="reader-view" class="view">
      <div class="reading-layout">
        <aside class="library-panel" aria-label="經典選擇">
          <div class="section-heading reader-intro"><h1>讀經，亦觀筆墨。</h1><p>展卷慢讀，於字裡行間安頓身心。</p></div>
          <div class="book-list" role="group" aria-label="選一部經典">
          <button class="book-card selected" data-book="heart" aria-pressed="true"><span class="book-number">卷 一</span><strong>心經</strong><span>般若波羅蜜多心經</span><small>唐 · 玄奘譯</small></button>
          <button class="book-card" data-book="diamond" aria-pressed="false"><span class="book-number">卷 二</span><strong>金剛經</strong><span>金剛般若波羅蜜經</span><small>姚秦 · 鳩摩羅什譯</small></button>
          <button class="book-card" data-book="daodejing" aria-pressed="false"><span class="book-number">卷 三</span><strong>道德經</strong><span>八十一章 · 王弼本</span><small>老子</small></button>
          <button class="book-card" data-book="lunyu" aria-pressed="false"><span class="book-number">卷 四</span><strong>論語</strong><span>二十篇 · 儒家經典</span><small>孔子與弟子言行</small></button>
          <button class="book-card" data-book="zhengdaoge" aria-pressed="false"><span class="book-number">卷 五</span><strong>證道歌</strong><span>永嘉證道歌 · 全文</span><small>唐 · 永嘉玄覺禪師</small></button>
          </div>
          <div class="sidebar-note"><span class="small-seal">靜</span><p>先辨字，再觀勢。<br>讀一卷經，習一份從容。</p></div>
        </aside>
        <div class="reader-column">
          <div class="reader-toolbar">
            <div class="toolbar-primary">
            <div class="font-control"><label for="font-select">書體</label><select id="font-select"><option value="yu">于右任標準草書</option><option value="longcang">龍藏草書</option><option value="mashan">馬善政毛筆體</option><option value="serif">宋體校讀</option></select></div>
            <div class="size-control"><label for="font-size">字號</label><button class="tool-button" id="size-decrease" aria-label="縮小字號">縮小</button><input id="font-size" type="range" min="24" max="200" step="2" value="48"><output id="size-value" for="font-size" aria-live="polite">48</output><button class="tool-button" id="size-increase" aria-label="放大字號">放大</button></div>
            <div class="size-presets" role="group" aria-label="常用字號"><button class="tool-button" data-size="64" aria-pressed="false">大字</button><button class="tool-button" data-size="96" aria-pressed="false">特大</button><button class="tool-button" data-size="160" aria-pressed="false">臨摹大字</button></div>
            </div>
            <div class="toolbar-secondary">
            <div class="layout-control" role="group" aria-label="排版選項"><span class="control-label">排版</span>
            <button class="tool-button" id="layout-toggle" aria-pressed="true">直排</button>
            <button class="tool-button" id="grid-toggle" aria-pressed="false">米字格</button>
            <button class="tool-button print-button" id="print-button">列印</button>
            </div>
          <div id="chapter-controls" hidden><label for="chapter-select" class="panel-label" id="chapter-label">章節選擇</label><select id="chapter-select"></select><div class="chapter-nav"><button id="prev-chapter">上一章</button><button id="next-chapter">下一章</button></div></div>
            </div>
          </div>
          <article class="sutra-paper" id="sutra-paper">
            <div class="paper-top"><span id="book-label">般若 · 心經</span><span id="text-count">玄奘譯本</span></div>
            <div class="sutra-title-row"><h2 id="sutra-title">般若波羅蜜多心經</h2><span class="title-seal">般若</span></div>
            <p class="sutra-attribution" id="sutra-attribution">唐三藏法師玄奘譯</p>
            <div class="font-loading" id="font-status" role="status" aria-live="polite"><span class="loading-mark" id="font-loading-mark" aria-hidden="true"></span><p id="font-loading-message">草書字體載入中，請稍候…</p><button id="font-retry" class="loading-retry" hidden>重新載入</button></div>
            <div class="scripture-scroll" tabindex="0" role="region" aria-label="經文，可左右捲動閱讀" aria-busy="true"><div class="scripture vertical font-yu" id="scripture" hidden></div></div>
            <div class="paper-bottom"><span id="reading-hint">經卷直排，從右向左讀</span><span>墨禪 · 臨賞</span></div>
          </article>
          <div class="reader-caption"><span class="caption-line"></span><p id="reader-note">經文與書體可自由切換；名家原作見「名家字帖」。</p></div>
          <p class="source-note" id="sutra-source"></p>
          <button class="original-link" id="reader-gallery"><span>觀原作</span><strong>于右任 · 草書館藏</strong><small>細看結字與行氣</small></button>
        </div>
      </div>
    </section>
    <section id="gallery-view" class="view" hidden></section>
    <section id="fonts-view" class="view" hidden></section>
  </main>
  <footer><a class="footer-brand" href="#">墨禪</a><span>草書經卷 · 澄心臨賞</span><button id="sources-button">內容與來源</button></footer>
  <dialog id="art-dialog" class="art-dialog"><button class="dialog-close" aria-label="關閉字帖">✕</button><div id="art-detail"></div></dialog>
  <dialog id="sources-dialog" class="sources-dialog"><button class="dialog-close" aria-label="關閉來源說明">✕</button><div id="sources-detail"></div></dialog>
  <script src="/app.js"></script>
</body>
</html>
